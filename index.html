beaches, swim between the flags.", "water": "⚠️ Big-city tap is treated but most drink filtered/bottled; on the coast and islands, bottled.", "safe": "Rio rewards street-smarts: enjoy the famous beaches and sights by day, keep phones and jewellery out of sight, carry only what you need ('beach money'), and use Uber/99 rather than walking unfamiliar areas at night. Favelas only with a reputable guide. Florianópolis is markedly calmer — a laid-back island of beaches. Standard big-city and beach-town sense covers both.", "er": "190 police · 192 ambulance"}, "China": {"vax": "Routine, Hepatitis A, Typhoid. Japanese encephalitis for long rural/summer stays.", "health": "Bottled/boiled water only. Air quality varies by city and season — check the AQI, sensitive travellers pack a mask. Big-city international hospitals are excellent (and pricey); insure well.", "water": "❌ Don't drink the tap. Bottled or boiled water only; hotels provide kettles and locals drink hot water everywhere.", "safe": "China is very safe for visitors day-to-day — violent crime against tourists is rare and cities feel secure late at night. The real friction is digital: bring a VPN installed BEFORE arrival (Google, WhatsApp, Instagram are blocked), and set up Alipay/WeChat Pay with a foreign card — cash is nearly dead here. Scams target tourists at tea houses and 'art galleries' near sights.", "er": "110 police · 120 ambulance · 119 fire"}, "Japan": {"vax": "Routine only — Japan is very low health-risk.", "health": "Tap water is excellent and safe everywhere. Pharmacies are ubiquitous; summers are hot and humid (hydrate), and the odd typhoon hits Jul–Oct. Healthcare is superb; carry your insurance details.", "water": "✅ Excellent and safe to drink from any tap nationwide.", "safe": "Japan is among the safest countries on Earth — lost wallets get returned, women travel solo comfortably, crime is remarkably low. The genuine risks are natural: earthquakes (know the drill) and typhoons. Learn a little train etiquette and you'll glide.", "er": "110 police · 119 ambulance/fire"}, "South Korea": {"vax": "Routine only; Hepatitis A for wider street-food eating.", "health": "Tap water is safe (though many locals prefer bottled/filtered by taste). Excellent, affordable healthcare. Hot humid summers; fine dust (미세먼지) days in spring — check the AQI and mask up if sensitive.", "water": "✅ Safe to drink from the tap; locals often prefer bottled for taste, not safety.", "safe": "South Korea is extremely safe with very low crime — Seoul and Busan feel secure around the clock. The main things to watch: heavy nightlife districts on weekends and spring dust days. Superb, cheap public transport everywhere.", "er": "112 police · 119 ambulance/fire"}, "Cambodia": {"vax": "Routine, Hepatitis A, Typhoid. Japanese encephalitis and malaria pills for rural/jungle stays (not Siem Reap town). Rabies awareness.", "health": "Bottled water only. Fierce sun at Angkor — start at dawn, hydrate, cover up. Dengue present, use repellent. Siem Reap has decent clinics (Royal Angkor); serious cases go to Bangkok.", "water": "❌ Don't drink the tap. Bottled water is cheap and everywhere; check the seal.", "safe": "Siem Reap is a well-trodden, welcoming tourist town and generally very safe. Watch for bag-snatching from motorbikes (wear bags cross-body, away from the road), and only use reputable tuk-tuks/PassApp. Petty scams around temples are mild. Never touch unexploded-ordnance warning areas off the beaten path.", "er": "117 police · 119 ambulance"}, "Laos": {"vax": "Routine, Hepatitis A, Typhoid. Japanese encephalitis and malaria pills for rural stays. Rabies awareness.", "health": "Bottled water only. Luang Prabang is laid-back and low-altitude; the sun and river activities are the main hazards — sunscreen, life jackets on boats. Clinics are basic; anything serious means evacuation to Thailand, so insure well.", "water": "❌ Don't drink the tap. Bottled water only; it's cheap and widely sold.", "safe": "Laos is one of Southeast Asia's calmest, safest countries — Luang Prabang especially so, with a gentle curfew keeping nights quiet. Petty theft is the main (low) risk. Stick to marked paths in rural areas (historic UXO risk) and use licensed transport.", "er": "191 police · 195 ambulance"}, "Sri Lanka": {"vax": "Routine, Hepatitis A, Typhoid. Japanese encephalitis for long rural stays; dengue is present — repellent.", "health": "Bottled/filtered water. Ella is hill-country (cooler, gentler); the sun is still strong at altitude. Watch footing on the famous railway walks. Good private hospitals in Colombo/Kandy; Ella has basic clinics.", "water": "❌ Don't drink the tap. Bottled or filtered water; it's cheap and everywhere.", "safe": "Sri Lanka is warm and largely very safe for travellers, with low violent crime. Solo women should take standard care with unwanted attention. Tuk-tuk overcharging is the main hustle — use the PickMe app for metered fares. Watch your footing on the scenic (active) railway tracks around Ella.", "er": "119 police · 1990 ambulance (Suwa Seriya)"}, "Nepal": {"vax": "Routine, Hepatitis A, Typhoid. Rabies awareness; Japanese encephalitis for the lowland Terai. Consider altitude meds if trekking high.", "health": "Bottled/filtered/boiled water only. Pokhara sits at a comfortable 800m, but if you trek from here, altitude sickness is the serious risk — ascend slowly, know the symptoms. Kathmandu air is dusty. Clinics in Pokhara handle basics; serious cases go to Kathmandu.", "water": "❌ Don't drink the tap. Bottled, filtered or boiled only; refill stations reduce plastic.", "safe": "Nepal is welcoming and generally safe, with mostly petty crime. In Pokhara the risks are outdoor: trekking without proper acclimatisation, lake/paragliding safety (use reputable operators), and monsoon landslides (Jun–Sep). Use registered trekking guides and check weather.", "er": "100 police · 102 ambulance"}, "Australia": {"vax": "Routine only — Australia is very low health-risk.", "health": "Tap water is excellent everywhere. The hazards are famously outdoors: ferocious sun (the world's highest skin-cancer rates — 'slip, slop, slap' sunscreen), rip currents (swim between the red-and-yellow flags), and respect for wildlife/heat on hikes. Superb healthcare; insure as it's costly for visitors.", "water": "✅ Excellent and safe to drink from any tap nationwide.", "safe": "Australia is very safe with low violent crime. The real risks are natural: sun, surf rips (always swim between the flags), bushfire season (check warnings in summer), and heat on outback drives. City nightlife precincts get rowdy late weekend but rarely dangerous.", "er": "000 (Triple Zero)"}, "New Zealand": {"vax": "Routine only — very low health-risk.", "health": "Tap water is pristine and safe. The intense hazard is UV — the ozone-thin sky burns fast, so sunscreen hard. Alpine and coastal weather turns quickly; respect track and marine safety. Excellent healthcare.", "water": "✅ Pristine and safe to drink from any tap (in the backcountry, treat river water).", "safe": "New Zealand is among the world's safest countries with very low crime. The genuine risks are all outdoors: fierce UV, fast-changing alpine weather, cold water, and adventure activities (use licensed operators). Don't leave valuables visible in parked cars at trailheads — that's the one common theft.", "er": "111 emergencies"}}, "diet": {"Thailand": {"v": "Easy if you say it right: 'jay' (เจ) means fully plant-based and every market has a jay stall. Watch fish sauce and oyster sauce — ask 'mai sai nam pla'.", "g": "Rice-based heaven: most noodles and rice dishes are naturally gluten-free; soy sauce (wheat) hides in stir-fries — ask for 'no soy sauce'.", "t": "Veg = 'gin jay' · no fish sauce = 'mai sai nam pla' · Bangkok's Chinatown runs a whole Jay festival every October."}, "Malaysia": {"v": "Indian-Malaysian canteens are a vegetarian goldmine — banana-leaf thali, chapati, dhal for $2. 'Sayur saja' = vegetables only.", "g": "Rice and rice-noodle dishes dominate; watch soy and kicap in stir-fries, and roti/mee are wheat.", "t": "Look for 'vegetarian' mamak counters; Buddhist 'zhai' shops in George Town are fully plant-based."}, "Vietnam": {"v": "'Chay' means vegetarian and it's a whole cuisine — every town has quán chay eateries; phở chay, bánh mì chay all exist.", "g": "Phở and most noodle soups use rice noodles — naturally GF; soy sauce and seitan mock-meats are the traps.", "t": "Say 'ăn chay' (I eat veg) · fish sauce = nước mắm, ask to skip · the 1st & 15th lunar days, chay food is everywhere."}, "Indonesia": {"v": "Tempeh and tofu are national treasures — gado-gado, urap, nasi campur can all go plant-based. Warung 'vegetarian' signs are common in Bali.", "g": "Rice-centred and largely GF by default; kecap manis (sweet soy) contains wheat — ask for plain sambal instead.", "t": "'Tanpa terasi' skips the shrimp paste · Ubud is one of Asia's vegan capitals — entire raw/vegan menus."}, "Philippines": {"v": "Hardest of the region — meat hides everywhere. Stick to Chinese-Filipino veggie houses, Bohol's farm cafés, and market fruit.", "g": "Rice-based mains are safe; soy sauce (toyo) is in most adobo and marinades — grilled fish + rice is the reliable order.", "t": "'Walang karne' = no meat · 'gulay lang' = just vegetables · big cities have growing vegan scenes (Cebu IT Park)."}, "North Macedonia": {"v": "Fast-day (posna) food is your friend — Orthodox fasting dishes are vegan by rule: tavče gravče, ajvar, grilled peppers, beans.", "g": "Grills (skara) are naturally GF; burek and bread are the wheat walls. Say 'bez gluten'.", "t": "'Posno' on a menu = plant-based by religious definition — the oldest vegan hack in the Balkans."}, "Serbia": {"v": "Same posna trick: fasting menus (prebranac beans, sarma without meat, grilled veg) are everywhere, especially Wednesdays/Fridays.", "g": "Meat off the grill is GF; burek, lepinja bread and beer are not. GF shops exist in Belgrade's malls.", "t": "'Posna hrana' = fasting food = vegan · kajmak and cheeses rule the veg-etarian (not vegan) table."}, "Montenegro": {"v": "Coastal menus lean fish + grilled veg; posna dishes and excellent tomatoes-cheese-olive spreads carry vegetarians.", "g": "Grilled fish and meats are safe; bread arrives with everything — just wave it off.", "t": "'Bez mesa' = without meat · konoba owners will improvise happily if you ask."}, "Egypt": {"v": "Accidentally vegan national dishes: koshary, ful medames, ta'ameya (fava falafel) — the cheapest food is the plant-based food.", "g": "Koshary is pasta-based (wheat); ful, rice dishes and grills are safe; baladi bread is everywhere but skippable.", "t": "'Nabati' = plant-based · Coptic fasting seasons make vegan food mainstream for weeks at a time."}, "Mauritius": {"v": "Huge Indian heritage = vegetarian paradise: dholl puri, gateau piment, seven-curries thali are all veg by default.", "g": "Dholl puri wraps are wheat; rice-based Creole curries and grilled fish are the GF lane.", "t": "'Pena laviann' (Creole) = no meat · temple canteens serve superb cheap veg thali."}, "Spain": {"v": "Tortilla, gazpacho, salmorejo (check bread), pimientos de padrón, escalivada — tapas culture has a veg lane if you order à la carte.", "g": "Jamón, tortilla, grilled fish are GF; beware croquetas (flour) and always ask about 'harina' in sauces. GF menus are legally common.", "t": "'Soy celiaco/a' is widely understood — Spain is one of Europe's best coeliac countries."}, "Italy": {"v": "Pasta al pomodoro, pizza marinara, contorni (side vegetables), and the whole aperitivo spread — vegetarian Italy is effortless; vegan needs 'senza formaggio'.", "g": "The pasta country is also a coeliac leader: 'senza glutine' pizza and pasta are certified (look for AIC signs) in most cities.", "t": "'Senza glutine' · 'vegano' is understood everywhere north of clichés."}, "France": {"v": "Classic bistros are stubborn, but boulangerie salads, falafel (Paris Marais!), and modern néo-bistros carry you; cheese makes vegetarian easy, vegan harder.", "g": "Galettes (buckwheat crêpes) are the great naturally-GF French meal; 'sans gluten' bakeries thrive in Paris.", "t": "'Sans gluten' / 'végétalien' (vegan) — say it with confidence, get a shrug, get fed anyway."}, "Belgium": {"v": "Frites are traditionally beef-fat fried — ask 'végétal?'; Ghent invented the weekly veggie day and Brussels has serious vegan frites.", "g": "Mussels and most frites are GF (check fryer); waffles and beer are the wheat walls — GF beer exists in specialist bars.", "t": "'Veggie dag' culture means every town has at least one full veggie kitchen."}, "United Kingdom": {"v": "The UK is Europe's vegan-label champion — every supermarket, pub and chippy has marked options; haggis comes in a beloved veggie version.", "g": "GF is legally labeled everywhere; chippies increasingly run dedicated GF fryers (check the sign).", "t": "Just read the label — UK menus mark V, VG and GF as standard."}, "Portugal": {"v": "Traditional menus are fish-heavy; vegetarians live well on soups (check stock), tomato rice and Lisbon's modern veg scene.", "g": "Grilled fish + rice + salad is the national GF meal; pastel de nata is wheat, alas.", "t": "'Sem glúten' · 'vegetariano' — Lisbon and Porto both have full vegan quarters now."}, "Norway": {"v": "Supermarkets are your ally: excellent plant-based ranges; restaurant menus always carry at least one veg dish, often superb.", "g": "Fish, potatoes and root veg are the traditional GF core; 'glutenfri' labeling is universal and reliable.", "t": "Allergy law is strict — staff can list every allergen from memory. Just ask."}, "Sweden": {"v": "Possibly Europe's easiest vegan country per capita — oat-milk homeland, and every lunch buffet has a green option.", "g": "'Glutenfri' is labeled by law; knäckebröd traps aside, GF bread is in every ICA.", "t": "Say nothing — just read the menu icons. Sweden did the work already."}, "Finland": {"v": "Helsinki's lounas buffets almost always include a vegan pot; oat everything, everywhere.", "g": "Rye is the national grain — GF options are labeled ('gluteeniton') and common; Karelian pasties come GF in bigger shops.", "t": "'Kasvis' = veg · 'vegaani' = vegan · allergy literacy is total."}, "Czechia": {"v": "Beyond fried cheese: Prague has one of Central Europe's biggest vegan scenes; traditional menus offer smažený sýr and dumplings-with-sauce vegetarian picks.", "g": "Dumplings and beer are wheat; roast meats + potatoes are safe. 'Bezlepkové' menus appear in most Prague districts.", "t": "'Bez masa' = meat-free · Prague's vegan map is genuinely long."}, "Slovakia": {"v": "Bryndzové halušky is vegetarian (sheep cheese); fasting-food tradition helps vegans in rural spots; Bratislava has modern veg bistros.", "g": "Halušky are potato-flour based but check; grills + potato dishes are the safe rail.", "t": "'Bezlepkový' = GF · 'bez mäsa' = without meat."}, "Romania": {"v": "Orthodox fasting ('de post') menus are vegan by definition — zacuscă, fasole bătută, sarmale de post; every menu marks them.", "g": "Mămăliga (polenta) is the great GF staple; covrigi and bread are the wheat.", "t": "'De post' = fasting = plant-based — Romania's menus label it as a category."}, "Poland": {"v": "Warsaw and Gdańsk rank among Europe's top vegan cities; pierogi ruskie are vegetarian and milk bars always have meatless classics.", "g": "Pierogi are wheat; placki ziemniaczane (potato pancakes) and grilled dishes are safer; 'bezglutenowe' labeling is growing fast.", "t": "'Jarskie' = meatless — the milk-bar word to know."}, "Estonia": {"v": "Tallinn's Telliskivi quarter is wall-to-wall plant-based; traditional menus always carry mushroom and potato mains.", "g": "Black rye bread is the icon and the trap; otherwise fish + potato culture is GF-friendly and labeling is exact.", "t": "'Taimne' = plant-based · Bolt Food filters by diet if it's raining."}, "Latvia": {"v": "Riga Central Market solves everything: berries, pickles, hemp butter, grey peas (vegan national dish!).", "g": "Grey peas with (skip the) speck, potato dishes and fish are GF; rye bread is the wheat wall.", "t": "'Bez gaļas' = without meat · grey peas + kefir is the original Latvian plant bowl."}, "United States": {"v": "Miami's Cuban counters do beans-rice-plantains vegan by accident; every US city menu marks V/VG and delivery apps filter by diet.", "g": "GF is a mainstream menu category — dedicated fryers and GF buns are normal in Florida chains.", "t": "Just ask — US servers recite allergens like poetry."}, "Dominican Republic": {"v": "Mangú, tostones, rice-and-beans, avocado — the Dominican plate goes plant-based easily if you ask 'sin carne'.", "g": "Plantain and rice culture = naturally GF core; watch fried items sharing oil with breaded things.", "t": "'Sin gluten' at resorts is well handled — buffets label; in comedores, point and smile."}}, "visa": {"general": "For most short tourist trips, citizens of the US, UK, EU/Schengen, Canada, Australia and New Zealand either enter visa-free or get a simple online authorisation (an eVisa or eTA) before flying. Typical visa-free stays run 30–90 days. Some countries want a visa arranged in advance, and a growing number ask you to fill an online arrival or eVisa form even when 'visa-free' — so always check the official portal for your exact nationality before you book.", "schengen": "This is a Schengen-area country. Most US, UK, EU, Canadian, Australian, NZ, Brazilian, Japanese and Korean passports enter visa-free for up to 90 days in any 180-day period across the whole Schengen zone. From 2025 the EU's ETIAS pre-authorisation applies to visa-free non-EU visitors — check before you fly."}};

function climChart(c){
 const W=340,H=110,base=86,mons='JFMAMJJASOND';
 const rmax=Math.max(...c.rain,1),tmax=40;
 let bars='',air='',sea='',lbl='';
 for(let i=0;i<12;i++){
  const x=12+i*27;
  const rh=(c.rain[i]/rmax)*52;
  bars+=`<rect x="${x-7}" y="${base-rh}" width="14" height="${rh}" rx="3" fill="#9db8d6"/>`;
  air+=(i?'L':'M')+`${x} ${base-(c.air[i]/tmax)*66} `;
  if(c.sea&&c.sea.length)sea+=(i?'L':'M')+`${x} ${base-(c.sea[i]/tmax)*66} `;
  lbl+=`<text x="${x}" y="${base+16}" text-anchor="middle" font-size="8.5" fill="#8b857a">${mons[i]}</text>`;
 }
 return `<svg class="clim" viewBox="0 0 ${W} ${H}">
 <line x1="6" y1="${base}" x2="${W-6}" y2="${base}" stroke="#e2dccc"/>
 ${bars}<path d="${air}" fill="none" stroke="#d07a35" stroke-width="2.4" stroke-linejoin="round"/>
 ${sea?`<path d="${sea}" fill="none" stroke="#0f96b2" stroke-width="2.2" stroke-linejoin="round"/>`:''}${lbl}</svg>
 <div class="legend"><span><i style="background:#d07a35"></i>Day °C</span>${sea?'<span><i style="background:#0f96b2"></i>Sea °C</span>':''}<span><i style="background:#9db8d6"></i>Rain</span></div>`;
}

function bindDest(){
 const list=$('#dlist');if(!list)return;
 const q=$('#q'),fv=$('#fv'),fs=$('#fs');

  let ids=ORDER.filter(i=>{const d=DEST[i];
   if(FR!=='All'&&d.region!==FR)return false;
   if(fv.value&&!d.vibes.includes(fv.value))return false;
   const s=(q.value||'').toLowerCase();
   if(s&&!(d.gname.toLowerCase().includes(s)||d.country.toLowerCase().includes(s)))return false;
   return true});

  else if(fs.value==='price')ids.sort((a,b)=>DEST[b].tiers.c-DEST[a].tiers.c);

   list.innerHTML=`<div class="dgrid">${ids.map(dcard).join('')}</div>`+(ids.length?'':'<p class="lead">No matches.</p>');

    out+=`<div class="reglab">${r}</div><div class="dgrid">${rid.map(dcard).join('')}</div>`}
   list.innerHTML=out;
  }};
 q.addEventListener('input',draw);fv.addEventListener('change',draw);fs.addEventListener('change',draw);
 $('#fr').addEventListener('click',e=>{const p=e.target.closest('.pill');if(!p)return;
  FR=p.dataset.r;document.querySelectorAll('#fr .pill').forEach(x=>x.classList.toggle('on',x===p));draw()});
 draw();
}
function render(){
 const h=location.hash.replace(/^#\/?/,'');
 const [v,arg]=h.split('/');
 $('#app').innerHTML = v==='city'?VIEWS.city(arg):(VIEWS[v]?VIEWS[v]():VIEWS.home());
 document.querySelectorAll('nav.m a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===(v||'home')));
 document.querySelector('nav.m').classList.remove('open');
 if(v==='city')bindCity(arg);
 if(v==='city')bindCounts();
 if(v==='destinations')bindDest();
 window.scrollTo(0,0);
}
function bindCounts(){
 if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const els=document.querySelectorAll('.stt b[data-n]');if(!els.length)return;
 const io=new IntersectionObserver(ents=>{ents.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);
  const el=en.target,n=+el.dataset.n,suf=el.dataset.suf||'',t0=performance.now(),D=900;
  (function tick(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=Math.round(n*e)+suf;if(p<1)requestAnimationFrame(tick)})(t0);
 })},{threshold:.4});
 els.forEach(el=>io.observe(el));
}
window.addEventListener('hashchange',render);
document.addEventListener('DOMContentLoaded',()=>{
 const cs=$('#cursel');
 cs.innerHTML=Object.keys(RATES).map(c=>`<option${c===CUR?' selected':''}>${c}</option>`).join('');
 cs.addEventListener('change',()=>{CUR=cs.value;localStorage.setItem('ss_cur',CUR);render()});
 $('.mb').addEventListener('click',()=>document.querySelector('nav.m').classList.toggle('open'));
 document.body.addEventListener('click',e=>{
  const lb=e.target.closest('.lbx');
  if(lb){lb.remove();return}
  const w=e.target.closest('.pgwrap');
  if(w){const o=document.createElement('div');o.className='lbx';o.innerHTML=w.querySelector('.pg').outerHTML;document.body.appendChild(o)}
 });
 render();
});
</script>
