<style>
:root{--ink:#14312a;--ink2:#0e241f;--gold:#e0a63c;--gold-soft:#f6ecd6;--bg:#faf8f3;--card:#fff;--line:#e8e2d4;--mut:#6f6a5e;--r:18px;--maxw:1120px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:#20201b;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Nunito,Inter,Arial,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(250,248,243,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nb{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-family:Nunito;font-weight:900;font-size:21px;letter-spacing:-.6px;color:var(--ink)}
.brand .dot{color:var(--gold)}
nav.m{display:flex;gap:2px;margin-left:auto;align-items:center}
nav.m a{padding:9px 13px;border-radius:11px;font-size:14.5px;font-weight:600;color:#3c4740}
nav.m a:hover{background:var(--gold-soft)}
nav.m a.on{background:var(--gold-soft);color:var(--ink)}
select.cur{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.btn{display:inline-block;padding:12px 22px;border-radius:13px;font-weight:800;font-size:14.5px;cursor:pointer;border:none;transition:.15s;font-family:Nunito}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--ink);color:#fff!important}
.btn-p:hover{box-shadow:0 8px 22px rgba(20,49,42,.3)}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-g{background:var(--gold);color:#3a2a07!important}
.btn-sm{padding:8px 15px;font-size:13px;border-radius:11px}
nav.m a.cta{color:#fff;background:var(--ink);margin-left:8px}
nav.m a.cta:hover{background:var(--ink2);color:#fff}
.mb{display:none;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-size:18px;cursor:pointer}
/* ---------- hero ---------- */
.hero{padding:74px 0 60px;text-align:center;background:radial-gradient(900px 400px at 50% -80px,#f4ecd9 0%,rgba(250,248,243,0) 70%)}
.hero .biglogo{margin-bottom:26px}
.hero h1{font-size:clamp(34px,5.6vw,58px);font-weight:900;letter-spacing:-1.6px;line-height:1.06;max-width:840px;margin:0 auto;color:var(--ink)}
.hero p.sub{font-size:clamp(16px,2.3vw,19.5px);color:var(--mut);max-width:680px;margin:20px auto 30px}
.hero .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero .supp{margin-top:24px;font-size:13.5px;color:var(--mut);font-weight:600;letter-spacing:.3px}

.heroph{position:relative;overflow:hidden}
.heroph .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heroph .hveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,32,26,.62),rgba(13,32,26,.55) 55%,rgba(250,248,243,.97) 96%)}
.heroph h1{color:#fff;text-shadow:0 2px 22px rgba(8,20,16,.45)}
.heroph p.sub{color:#eee8da;text-shadow:0 1px 12px rgba(8,20,16,.5)}
.heroph .supp{color:#f6f1e3;background:rgba(12,26,21,.42);display:inline-block;padding:8px 18px;border-radius:22px;backdrop-filter:blur(4px)}
.signup{margin-top:26px;background:linear-gradient(120deg,var(--ink),#1d4a3e);border-radius:var(--r);padding:22px 26px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.signup b{font-family:Nunito;font-size:18px;color:#fff}
.signup p{font-size:13px;color:#c9d3c8;margin-top:3px}
.signup .btn-p{background:var(--gold);color:#3a2a07!important}
.pb-count{font-size:13.5px;color:#5c5233;background:#fff;border:1px dashed #ddc98f;border-radius:12px;padding:11px 14px;margin-bottom:14px}
.pb-count b{color:var(--ink)}
.statbar{display:flex;justify-content:center;gap:clamp(18px,5vw,64px);padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
.statbar b{display:block;font-family:Nunito;font-size:26px;font-weight:900;color:var(--ink);letter-spacing:-.5px}
.statbar span{font-size:12px;letter-spacing:1.6px;color:var(--mut);font-weight:700;text-transform:uppercase}
/* ---------- sections ---------- */
section.blk{padding:58px 0}
section.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
h2.sec{font-size:clamp(25px,3.6vw,36px);font-weight:900;letter-spacing:-1px;margin-bottom:12px;color:var(--ink)}
p.lead{color:var(--mut);max-width:740px;margin-bottom:26px;font-size:16.5px}
ul.feat{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
ul.feat li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;font-size:14.5px;color:#4b4a42}
ul.feat li b{display:block;margin-bottom:3px;font-size:15px;color:var(--ink);font-family:Nunito;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:10px}
.pcard h3{font-size:20px;font-weight:900;color:var(--ink)}
.pcard p{font-size:14px;color:var(--mut);flex:1}
/* ---------- destination cards ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 22px}
.filters input[type=search]{flex:1;min-width:200px;padding:11px 15px;border:1.5px solid var(--line);border-radius:12px;font-size:14.5px;background:#fff}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;cursor:pointer;color:#4b544d}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
select.filt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.dcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:7px;transition:.15s}
.dcard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,49,42,.1)}
.dcard .co{font-size:11px;letter-spacing:1.6px;font-weight:800;color:var(--mut);text-transform:uppercase}
.dcard h3{font-size:21px;font-weight:900;letter-spacing:-.5px;color:var(--ink)}
.dcard .hk{font-size:13.5px;color:var(--mut);flex:1}
.dcard .mt{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:#4b544d;border-top:1px dashed var(--line);padding-top:9px;margin-top:5px}
.gbadge{position:absolute;top:14px;right:14px;background:var(--gold);color:#3a2a07;font-size:10.5px;font-weight:900;padding:4px 10px;border-radius:14px;letter-spacing:.4px;font-family:Nunito}
.reglab{margin:32px 0 12px;font-size:12px;letter-spacing:2.6px;font-weight:900;color:var(--gold);text-transform:uppercase;font-family:Nunito}
/* ---------- city page ---------- */
.cph{padding:52px 0 26px}
.cph .co{font-size:12.5px;letter-spacing:2px;font-weight:800;color:var(--mut);text-transform:uppercase}
.cph h1{font-size:clamp(32px,5.4vw,50px);font-weight:900;letter-spacing:-1.4px;margin:6px 0 8px;color:var(--ink)}
.cph p.hk{color:var(--mut);max-width:700px;font-size:17.5px}
.vibes{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.vibe{background:var(--gold-soft);border:1px solid #eddebb;color:#7c5c1c;font-size:12px;font-weight:800;padding:5px 12px;border-radius:16px}
.guidebar{background:linear-gradient(120deg,var(--ink),#1d4a3e);border-radius:var(--r);color:#f3eee2;padding:26px 28px;margin:18px 0;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.guidebar .t{flex:1;min-width:240px}
.guidebar h3{font-size:21px;font-weight:900;color:#fff;margin-bottom:5px}
.guidebar p{font-size:13.5px;color:#cfd8ce}
.guidebar .btns{display:flex;gap:9px;flex-wrap:wrap}
.tiergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:8px 0 8px}
.tier{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:center}
.tier.hl{border:2px solid var(--gold);background:#fffdf6}
.tier .lb{font-size:10.5px;letter-spacing:2.2px;font-weight:900;color:var(--mut)}
.tier .v{font-family:Nunito;font-size:30px;font-weight:900;color:var(--ink);margin:5px 0 2px}
.tier .v small{font-size:12px;color:var(--mut);font-weight:700}
.tier .d{font-size:11.5px;color:var(--mut)}
.maths{background:var(--gold-soft);border:1px solid #eddebb;border-radius:var(--r);padding:20px 22px;margin:10px 0 6px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.maths b.ttl{font-family:Nunito;font-size:16px;color:var(--ink)}
.maths input,.maths select{border:1.5px solid #e2cf9d;border-radius:10px;padding:9px 11px;font-size:14px;font-weight:700;background:#fff;width:86px}
.maths select{width:auto}
.maths .out{font-family:Nunito;font-size:23px;font-weight:900;color:var(--ink);margin-left:auto}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.w2{grid-column:1/-1}
.card h3{font-family:Nunito;font-size:16.5px;font-weight:900;color:var(--ink);margin-bottom:11px;display:flex;gap:8px;align-items:center}
.rows{display:grid;gap:0}
.row{display:flex;justify-content:space-between;gap:12px;padding:7.5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:none}
.row .n{color:#43423a}
.row .n small{display:block;color:#9a948a;font-size:11px}
.row .p{font-weight:800;color:var(--ink);white-space:nowrap}
.note{background:var(--gold-soft);border-radius:12px;padding:11px 14px;font-size:12.5px;color:#6b5320;margin-top:11px}
.chip{display:inline-block;background:#f1ede2;border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:12px;font-weight:700;color:#4b544d;margin:0 5px 6px 0}
.tip{border-left:3px solid var(--gold);padding:8px 0 8px 14px;margin:10px 0;font-size:13.5px;color:#43423a}
.tip .by{font-size:12px;color:var(--mut);font-weight:700;margin-top:4px}
.tip b.tt{color:var(--ink)}
.kv{font-size:13.5px;color:#43423a;margin-bottom:9px}
.kv b{color:var(--ink)}
.clim{width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);font-weight:700;margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bk{display:inline-block;margin:26px 0 0;font-weight:800;font-size:14px;color:var(--mut)}
.bk:hover{color:var(--ink)}
/* ---------- photos & colour ---------- */
.phimg{width:100%;height:100%;object-fit:cover;display:block}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:34px}
.stile{position:relative;height:150px;border-radius:16px;overflow:hidden;display:block;transition:.15s}
.stile:hover{transform:translateY(-3px)}
.stile .vl{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,20,0) 40%,rgba(10,25,20,.65))}
.stile b{position:absolute;left:12px;bottom:9px;color:#fff;font-family:Nunito;font-size:14.5px;font-weight:900;letter-spacing:-.2px}
.dph{height:112px;margin:-20px -20px 12px;overflow:hidden;position:relative}
.dstripe{height:7px;margin:-20px -20px 14px;border-radius:18px 18px 0 0}
.gcard .top{position:relative;padding:0;height:160px;overflow:hidden}
.gcard .top .vl{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,28,22,.12) 30%,rgba(10,28,22,.78))}
.gcard .top .tx{position:absolute;left:18px;bottom:12px;right:14px}
.cityhero{position:relative;height:270px;border-radius:var(--r);overflow:hidden;margin:4px 0 16px;background:linear-gradient(120deg,#1d4a3e,#14312a)}
.cityhero .vl{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,20,0) 45%,rgba(10,25,20,.5))}
/* ---------- guide preview ---------- */
.prevrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:14px}
.pgwrap{cursor:zoom-in}
.pgwrap:hover .pg{transform:translateY(-3px);box-shadow:0 14px 32px rgba(20,49,42,.18)}
.pgcap{text-align:center;font-size:12px;font-weight:700;color:var(--mut);margin-top:8px}
.pg{aspect-ratio:210/297;background:#fbf9f3;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(20,49,42,.1);overflow:hidden;position:relative;font-size:6.4px;transition:.15s}
.pg *{line-height:1.45}
.pg .pad{padding:9% 8%}
.pg .nhd{display:flex;gap:.5em;align-items:baseline;border-bottom:.22em solid #2b463d;padding-bottom:.55em;margin-bottom:.9em}
.pg .nhd b{font-family:Nunito;font-size:1.85em;font-weight:900;color:#232323;letter-spacing:-.03em}
.pg .lede{font-style:italic;font-size:1.15em;color:#0f5d4a;margin-bottom:1em;font-family:Georgia,serif}
.pg .tg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7em;margin-bottom:1em}
.pg .tc{background:#fff;border:1px solid #ece7db;border-radius:.9em;padding:1em .6em;text-align:center}
.pg .tc.hl{border:.18em solid #6bbf9c;background:#eef6f0}
.pg .tc .l{font-size:.78em;letter-spacing:.18em;color:#8a857a;font-weight:800}
.pg .tc .v{font-family:Nunito;font-size:2em;font-weight:900;color:#0f5d4a;margin:.15em 0}
.pg .tc .d{font-size:.75em;color:#6f6a5e}
.pg .rw{display:flex;justify-content:space-between;padding:.5em 0;border-bottom:.5px dashed #e2dccc;font-size:.95em;color:#43423a}
.pg .rw b{color:#14312a}
.pg .vc{background:#fff;border:1px solid #ece7db;border-radius:.9em;padding:.9em 1em;margin-bottom:.7em}
.pg .vc .t{font-weight:800;color:#0f5d4a;font-size:1.1em;font-family:Nunito}
.pg .vc .m{font-size:.72em;letter-spacing:.1em;color:#c56a36;font-weight:800;text-transform:uppercase;margin:.15em 0 .3em}
.pg .vc .d{font-size:.86em;color:#4b4a42}
.pg .tipbx{background:#fbf3da;border:1px solid #ecd6a0;border-radius:.9em;padding:.9em 1em;font-size:.9em;color:#5c5233}
.pg .foot{position:absolute;left:8%;right:8%;bottom:3.5%;border-top:.5px solid #e2dccc;padding-top:.6em;display:flex;justify-content:space-between;font-size:.75em;color:#9a948a}
.pg .cols{columns:2;column-gap:1.4em}
.pg .ck{font-size:.92em;color:#43423a;padding:.28em 0;break-inside:avoid}
.pg .ck::before{content:"✓ ";color:#e0a63c;font-weight:900}
.pg.cover{background:#14312a;color:#fff}
.pg.cover .cvimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.pg.cover .vl{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,26,21,.25),rgba(12,26,21,.2) 40%,rgba(12,26,21,.86))}
.pg.cover .in{position:absolute;left:9%;right:9%;bottom:7%}
.pg.cover .pillt{position:absolute;top:6%;right:8%;background:rgba(255,255,255,.92);color:#1e463b;font-size:.75em;letter-spacing:.14em;font-weight:800;padding:.5em 1em;border-radius:2em}
.pg.cover .kick{font-size:.8em;letter-spacing:.22em;color:#e0a63c;font-weight:800}
.pg.cover .big{font-family:Nunito;font-size:3.1em;font-weight:900;letter-spacing:-.03em;line-height:1;margin:.15em 0}
.pg.cover .sub{font-family:Georgia,serif;font-style:italic;font-size:.95em;opacity:.95;margin-bottom:.8em}
.pg.cover .wm{font-family:Nunito;font-size:1.25em;font-weight:900}
.pg.cover .wm i{color:#e0a63c;font-style:normal}
/* promo box */
.prev2{grid-template-columns:repeat(3,minmax(170px,220px));align-items:start;justify-content:start}
.prev2 .promobox{grid-column:1/-1}
@media(max-width:900px){.prev2{grid-template-columns:1fr 1fr}}
.pg.real{aspect-ratio:auto;padding:0}
.pg.real img{display:block;width:100%;height:auto}
.promobox{background:linear-gradient(135deg,#fffdf6,#fdf6e6);border:1.5px solid #ecd9ae;border-radius:var(--r);padding:26px 28px}
.promobox h3{font-family:Nunito;font-size:21px;font-weight:900;color:var(--ink);margin-bottom:8px;letter-spacing:-.4px}
.pb-lead{font-size:14px;color:#5c5233;margin-bottom:16px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
@media(min-width:920px){.statgrid{grid-template-columns:repeat(5,1fr)}}
.stt{background:#fff;border:1px solid #ecd9ae;border-radius:14px;padding:13px 10px;text-align:center}
.stt b{display:block;font-family:Nunito;font-size:25px;font-weight:900;color:var(--ink);letter-spacing:-.5px}

l network"}], "transit": [["Orbus single", 2, 4], ["Day pass", 8, 8], ["Skyline gondola", 30, 45], ["Airport bus to town", 8, 14]], "stays": {"night": [["Hostel dorm bed", 30, 55], ["Airbnb 1-BR", 120, 210], ["3-star hotel", 120, 220], ["Lake-view boutique", 260, 520]], "month": [["Studio", 1400, 2200], ["1-BR, decent area", 1700, 2500]]}, "market": {"chains": [{"n": "Pak'nSave", "t": "the yellow discounter — cheapest"}, {"n": "Countdown / Woolworths", "t": "full-range"}, {"n": "New World", "t": "nicer, pricier"}, {"n": "Farmers' market", "t": "weekend produce"}], "items": [["Milk 1L", 1.7], ["Bread", 2.3], ["Eggs 12", 5], ["Cheese 1kg", 10], ["Chicken 1kg", 8.5], ["Rice 1kg", 2.2], ["Beer 0.5L", 3.5], ["Coffee jar", 7]]}, "eat": [["Fergburger / bakery", 8, 15], ["Café brunch", 15, 25], ["Pub meal", 20, 32], ["Restaurant dinner", 32, 58], ["Fine dining tasting", 120, 250]], "kids": [["Skyline gondola + luge", 45, 65], ["Lake Wakatipu beach + walks", 0, 0], ["TSS Earnslaw steamship cruise", 40, 70]], "nokids": [["Bungee (the original, AJ Hackett)", 130, 200], ["Shotover jet-boat", 90, 130], ["Milford Sound day trip", 120, 220], ["Gibbston Valley wine tour", 80, 150]], "climate": {"air": [22, 22, 19, 16, 12, 8, 8, 10, 13, 16, 18, 20], "sea": null, "rain": [75, 60, 70, 65, 70, 60, 55, 60, 65, 85, 80, 80], "wet": "year-round (spread)", "best": "Dec – Mar (summer) / Jun – Aug (ski)", "note": "Alpine: warm summers for hiking/lake days, cold snowy winters for skiing. Weather turns fast any season — layer and check forecasts."}, "fly": {"air": ["Air New Zealand", "Jetstar", "Qantas"], "routes": [["Auckland", 60, 160], ["Sydney", 120, 300], ["Christchurch", 50, 130]], "note": "Queenstown (ZQN) airport is one of the world's most scenic landings, 10 min from town. Direct flights from Australia and across NZ."}, "tips": [{"t": "Pick one big thrill, walk the rest free", "b": "Queenstown's adventures (bungee, jet-boat, skydive, Milford day trips) are spectacular but pricey — choose one or two hero experiences rather than blowing the budget on all. The scenery itself is free: lakeside walks, Queenstown Hill, and Fergburger to refuel. The gondola-and-luge combo is the best-value bit of fun.", "by": "@adrenaline.nz", "w": "May '26", "up": 92}], "flag": "🇳🇿", "gname": "Queenstown", "guide": false, "flav": ""}, "wellington": {"id": "wellington", "name": "Wellington", "country": "New Zealand", "region": "Oceania", "vibes": ["city", "culture", "food"], "hook": "NZ's compact creative capital — craft coffee and beer, film cool, windswept charm.", "tiers": {"s": 60, "c": 115, "f": 220}, "rides": [{"a": "Uber", "hop": [8, 14], "cross": [16, 30], "note": "works citywide"}, {"a": "Ola / Zoomy", "hop": [7, 13], "cross": [14, 28], "note": "local apps, compare"}, {"a": "Bus / train (Snapper)", "hop": [2, 4], "cross": [4, 7], "note": "incl. the cable car"}], "transit": [["Snapper bus single", 2, 4], ["Cable car (return)", 6, 8], ["Day pass", 7, 7], ["Airport bus to centre", 5, 8]], "stays": {"night": [["Hostel dorm bed", 26, 46], ["Airbnb 1-BR", 95, 165], ["3-star hotel", 90, 165], ["Boutique hotel", 200, 400]], "month": [["Studio", 1250, 1900], ["1-BR, decent area", 1500, 2200]]}, "market": {"chains": [{"n": "Pak'nSave", "t": "the yellow discounter — cheapest"}, {"n": "Countdown / Woolworths", "t": "full-range"}, {"n": "New World", "t": "nicer, pricier"}, {"n": "Farmers' market", "t": "weekend produce"}], "items": [["Milk 1L", 1.7], ["Bread", 2.3], ["Eggs 12", 5], ["Cheese 1kg", 10], ["Chicken 1kg", 8.5], ["Rice 1kg", 2.2], ["Beer 0.5L", 3.5], ["Coffee jar", 7]]}, "eat": [["Bakery / food-truck lunch", 8, 15], ["Café brunch", 15, 25], ["Craft-beer pub meal", 18, 30], ["Restaurant dinner", 28, 52], ["Fine dining tasting", 100, 230]], "kids": [["Te Papa museum (free)", 0, 0], ["Wellington Cable Car + gardens", 6, 8], ["Zealandia eco-sanctuary", 25, 30]], "nokids": [["Te Papa national museum (free)", 0, 0], ["Weta Workshop film tour", 35, 60], ["Craft-beer + coffee crawl", 20, 50], ["Mt Victoria lookout walk (free)", 0, 0]], "climate": {"air": [20, 20, 19, 17, 14, 12, 11, 12, 14, 15, 17, 19], "sea": [17, 18, 17, 16, 15, 14, 13, 12, 13, 13, 14, 16], "rain": [72, 62, 82, 90, 110, 120, 130, 110, 95, 105, 90, 85], "wet": "May – Sep", "best": "Nov – Apr (summer)", "note": "Mild but famously windy ('Windy Welly'). Summers (Dec–Mar) are warmest and calmest-ish; pack a windproof layer any season."}, "fly": {"air": ["Air New Zealand", "Jetstar", "Qantas"], "routes": [["Auckland", 50, 140], ["Christchurch", 50, 130], ["Sydney", 120, 300]], "note": "Wellington (WLG) airport is 10 min from town (famously gusty landings). The Interislander ferry to the South Island also leaves from here."}, "tips": [{"t": "Free Te Papa, then the coffee trail", "b": "Te Papa — NZ's brilliant national museum — is free and worth half a day. Wellington's real culture, though, is in the cup: it rivals Melbourne for coffee and craft beer, so spend an afternoon on a Cuba Street café-and-brewery crawl. Ride the cable car up and walk down through the botanic gardens for free.", "by": "@windy.welly", "w": "May '26", "up": 75}], "flag": "🇳🇿", "gname": "Wellington", "guide": false, "flav": ""}};
const CINFO={"atm": {"Thailand": {"fee": "The region's worst: a flat 220 ฿ (~$6) surcharge on every foreign-card withdrawal, at every bank. Soften it by withdrawing the max (20,000–30,000 ฿) in one go.", "lim": "20,000–30,000 ฿ per pull (Krungsri and CIMB sit at the generous end) — max it out to dilute that flat fee.", "best": ["Bangkok Bank", "Kasikorn", "Krungsri"], "tip": "Thailand is an EXCHANGE country: bring crisp USD/EUR notes and change at SuperRich (the green/orange booths) or Vasu in Bangkok — rates beat any card path. Counter cash-advance inside a bank branch (passport needed) also dodges the 220 ฿."}, "Malaysia": {"fee": "Kind by comparison: most local banks add no surcharge, or a small RM 10–12 at worst — only your home bank's fees apply.", "lim": "Typically RM 1,500–3,000 per pull, some machines RM 5,000.", "best": ["Maybank", "CIMB", "Public Bank"], "tip": "Licensed money changers (malls in KL, Lebuh Chulia in George Town) give excellent cash rates for major currencies — fine for topping up, no need to carry big sums."}, "Vietnam": {"fee": "Typically 22,000–55,000 ₫ per withdrawal with lowish limits (2–5 M ₫); TPBank and VPBank are the traveller favourites for free or near-free pulls with higher limits.", "lim": "Most banks 2–5 M ₫ per pull; TPBank and VPBank allow up to ~8–10 M ₫ — another reason they're the picks.", "best": ["TPBank", "VPBank", "Vietcombank"], "tip": "Cards are fine, but exchange counters at banks or gold shops give honest rates for USD/EUR. Refuse any ATM's own 'conversion' — always be charged in đồng."}, "Indonesia": {"fee": "Most big-bank ATMs add no local surcharge — your bank's fee is the whole cost. Limits per pull are modest (2.5 M Rp on 50k-note machines).", "lim": "1.25–2.5 M Rp on 50k-note machines; look for 100k-note machines (marked on the slot) for ~3 M Rp pulls.", "best": ["BCA", "Mandiri", "BNI"], "tip": "Use ATMs attached to real bank branches, never lone boxes in tourist lanes. On Gili Air, machines run dry and offline — carry cash over from Bali/Lombok. Exchange only at authorised 'PVA Berizin' offices; street 'no commission' boards are sleight-of-hand counters."}, "Philippines": {"fee": "A flat ₱250 rides on almost every foreign withdrawal, with 10,000–20,000 ₱ limits — it stings in percentages on small pulls.", "lim": "₱10,000–20,000 at most banks; HSBC allows up to ₱40,000 — four fees become one.", "best": ["HSBC (higher limits)", "BPI", "BDO"], "tip": "HSBC branches allow bigger single withdrawals, diluting the flat fee. Bring some USD as backup for islands; change at bank counters or established changers, not kiosks."}, "North Macedonia": {"fee": "Local bank ATMs are generally surcharge-free — only your home bank's cut applies.", "lim": "Around 20,000–30,000 ден per pull at most banks — generous relative to prices here.", "best": ["NLB", "Komercijalna Banka", "Halkbank"], "tip": "This is an exchange-friendly country: menuvachnici (exchange offices) convert EUR cash at razor-thin spreads — arriving with euros and changing as you go is genuinely the cheapest path."}, "Serbia": {"fee": "Bank ATMs mostly add nothing; the plague is Euronet's blue boxes with painful rates and fees — walk past every one.", "lim": "Commonly 40,000–60,000 din per pull at bank machines.", "best": ["Banca Intesa", "OTP", "NLB Komercijalna"], "tip": "Menjačnice (exchange offices) are everywhere and excellent — EUR cash changes at near-interbank rates in Belgrade. Always pay and withdraw in dinars, never accept conversion."}, "Montenegro": {"fee": "It's euro country, and most banks here do surcharge foreign cards ~€2–4 per withdrawal.", "lim": "Usually €300–600 per pull.", "best": ["Hipotekarna Banka", "CKB", "NLB"], "tip": "Simplest play: arrive with EUR cash — it's the local currency, so no exchange needed at all. Withdraw rarely and large when you must."}, "Czechia": {"fee": "Czech bank ATMs are surcharge-free; Euronet's tourist-zone army is not — and its 'converted' rates are 10 %+ bad.", "lim": "Bank machines allow hefty pulls (10,000–20,000+ Kč); Euronet deliberately caps low to multiply its fees.", "best": ["Česká spořitelna", "ČSOB", "Komerční banka"], "tip": "Never touch the Old-Town exchange kiosks with the '0 % commission' signs — the margin is in the rate. If you must change cash, use a bank or a vetted honest exchange; otherwise card + bank ATM is perfect. Decline CZK↔your-currency 'conversion' every single time."}, "Slovakia": {"fee": "Eurozone: bank ATMs add no surcharge; only Euronet boxes do.", "lim": "Typically €300–700 per pull at bank machines.", "best": ["Slovenská sporiteľňa", "Tatra banka", "VÚB"], "tip": "Cards work everywhere; keep a €20 note for markets and you're covered."}, "Romania": {"fee": "Bank ATMs are broadly surcharge-free; the Old-Town Euronet boxes are the trap, as ever.", "lim": "Bank machines 2,000–5,000 lei; Euronet caps around 800 to farm fees.", "best": ["Banca Transilvania", "BCR", "ING"], "tip": "Withdraw lei from bank machines and always in lei. For cash exchange use banks or established case de schimb — never the guy 'helping' near a machine."}, "Poland": {"fee": "Bank ATMs: no surcharge. Euronet: everywhere, and to be avoided everywhere.", "lim": "Bank machines 1,000–3,000+ zł; Euronet again caps low on purpose.", "best": ["PKO BP", "Santander", "mBank"], "tip": "Poland is also a good exchange country: kantors (away from stations and tourist squares) change EUR/USD at tight spreads. Pay in złoty always — DCC is the national tourist tax."}, "Estonia": {"fee": "Surcharge-free bank ATMs — though you'll barely need cash in Europe's most card-native country.", "lim": "Machine ceilings of €500–1,000+ — effectively your own card's daily limit.", "best": ["Swedbank", "SEB", "LHV"], "tip": "Skip exchanging entirely; tap your card for everything from markets to trams."}, "Latvia": {"fee": "Same story: bank ATMs free of local fees, cash barely needed.", "lim": "Same: €500–1,000+ ceilings, your card's limit is the real cap.", "best": ["Swedbank", "SEB", "Citadele"], "tip": "Card everywhere; a little cash for Central Market stalls is all you'll want."}, "Italy": {"fee": "Bank 'bancomat' machines add no local surcharge; independent boxes (Euronet and friends) at stations and sights do.", "lim": "Commonly €250–500 per pull.", "best": ["Intesa Sanpaolo", "UniCredit", "BPER"], "tip": "Withdraw at real bank branches, always in euros. Skip airport/tourist exchange counters entirely — rates are ceremonial robbery."}, "France": {"fee": "Bank ATMs ('distributeurs') are surcharge-free; avoid the gold-and-blue independent machines near sights.", "lim": "Commonly €300–500 per pull.", "best": ["BNP Paribas", "Crédit Agricole", "Société Générale"], "tip": "Card country; you need little cash. If exchanging, a bank beats every bureau on the tourist trail."}, "Belgium": {"fee": "Bank ATMs (now often shared white 'CASH' points) are surcharge-free for standard withdrawals.", "lim": "Typically €500–650 per pull.", "best": ["Belfius", "KBC", "BNP Paribas Fortis"], "tip": "Frites stands take cards these days; keep a €10 note for markets and you're set."}, "United Kingdom": {"fee": "Most bank and LINK machines are marked 'FREE cash withdrawals' — trust the label; convenience-store boxes charging £1.50–2 are the ones to skip.", "lim": "Typically £300–500 per pull at bank machines.", "best": ["Barclays", "Lloyds", "HSBC"], "tip": "Always charge in pounds, never the 'helpful' home-currency option. Exchange offices are unnecessary — the free ATM network wins."}, "Portugal": {"fee": "The state Multibanco (MB) network adds no surcharge (€200/withdrawal, €400/day). Euronet paints its Lisbon boxes to look like MB — check the logo.", "lim": "The Multibanco rule: €200 per withdrawal, €400 per day — plan around it.", "best": ["Multibanco (MB)", "Millennium BCP", "Caixa Geral"], "tip": "Real Multibanco + paying in euros = zero drama. Tourist-strip exchange counters exist only for the unwary."}, "Spain": {"fee": "The tricky one: Spanish banks surcharge foreign cards €0–5 each — Santander and CaixaBank sit at the punchy end, smaller banks are kind.", "lim": "€300–600 typical; some machines offer €1,000 'premium' pulls with a bigger fee — decline.", "best": ["ABANCA", "EVO Banco", "Ibercaja"], "tip": "Check the on-screen fee before confirming and walk to the next bank if it's €3+. Decline conversion, and skip exchange offices — a low-fee ATM beats them all."}, "Norway": {"fee": "Minibank ATMs are surcharge-free — but this is a near-cashless country; you may go the whole trip without notes.", "lim": "5,000–10,000 kr per pull (9,900 is a common ceiling) — not that you'll need it.", "best": ["DNB", "SpareBank 1"], "tip": "Don't exchange money for Norway at all. Card and phone cover 100 % of life; a single small withdrawal covers flea markets."}, "Sweden": {"fee": "The blue cooperative 'Bankomat' machines are the standard and add nothing.", "lim": "Bankomat machines allow 5,000–10,000 kr per pull.", "best": ["Bankomat", "Handelsbanken"], "tip": "Sweden is arguably the most cashless place on Earth — some cafés refuse cash. Don't exchange; just tap."}, "Finland": {"fee": "Orange 'Otto.' machines are the national free network. The yellow 'Nosto' machines charge — learn the two names and you're done.", "lim": "Otto. machines typically €400–1,000 per pull.", "best": ["Otto.", "Nordea"], "tip": "Otto = yes, Nosto = no. Beyond that, card everything."}, "United States": {"fee": "Every machine that isn't your own bank's charges $3–5.50, and hotel/store ATMs push $6+. There's no free-for-foreigners network.", "lim": "Usually $300–800 per pull depending on the bank — your card's daily cap is often the binding limit.", "best": ["Chase", "Bank of America", "Wells Fargo"], "tip": "Minimise cash entirely — the US runs on cards. If you need bills, one big withdrawal at a major bank branch ATM. Never use airport exchange counters; their rates are the worst in the country."}, "Dominican Republic": {"fee": "Expect RD$200–350 per withdrawal with modest limits; resort-lobby machines charge most of all.", "lim": "Typically RD$10,000–20,000 per pull.", "best": ["Banco Popular", "Banreservas", "BHD"], "tip": "USD cash is welcome nearly everywhere tourist-side — bring some. Change at banks or proper cambios; count carefully, smile always."}, "Egypt": {"fee": "Most bank ATMs add little or nothing; the constraint is per-pull limits (3,000–4,000 E£ typically).", "lim": "3,000–4,000 E£ per pull is the norm; do several pulls on separate days for big spends.", "best": ["CIB", "Banque Misr", "National Bank of Egypt"], "tip": "Bring USD or EUR notes — bank exchange is quick and cash rules daily life here. Hoard small bills; everyone 'has no change'."}, "Mauritius": {"fee": "MCB and SBM machines are low- or no-surcharge and everywhere that matters.", "lim": "Typically Rs 10,000–25,000 per pull at MCB/SBM.", "best": ["MCB", "SBM"], "tip": "Bank exchange counters (even the airport ones) run fair spreads here — changing some EUR on arrival is perfectly fine."}, "Netherlands": {"fee": "Bank ATMs (Geldmaat, the shared yellow network) add no surcharge — only your home bank's fee.", "lim": "Typically €250–500 per pull.", "best": ["Geldmaat", "ING", "Rabobank"], "tip": "Card and phone cover everything here; many places are cashless. Skip exchange offices entirely."}, "Austria": {"fee": "Bank ATMs (Bankomat) are surcharge-free; Euronet boxes near sights are the trap.", "lim": "€400–1,000 per pull at bank machines.", "best": ["Erste/Sparkasse", "Bank Austria", "Raiffeisen"], "tip": "Pay in euros always. Vienna runs largely on cards; keep a €20 note for markets."}, "Hungary": {"fee": "Bank ATMs add no surcharge, but many now ask a rendszerdíj — decline the on-screen fee and use a bank machine. Euronet is everywhere and awful.", "lim": "Bank machines 150,000–300,000 Ft; Euronet caps low to farm fees.", "best": ["OTP", "K&H", "Erste"], "tip": "Always pay and withdraw in forint, never euros — the 'conversion' is a 10% tax. Budapest has good exchange offices away from Váci utca."}, "Greece": {"fee": "Greek bank ATMs surcharge foreign cards €2–3; Euronet's island armies charge more with worse rates.", "lim": "€400–600 per pull at bank machines.", "best": ["National Bank (Ethniki)", "Piraeus", "Alpha Bank"], "tip": "On islands, withdraw enough in town — remote machines run dry in August. Decline conversion; skip Euronet."}, "Croatia": {"fee": "Now euro country; bank ATMs are surcharge-free, Euronet boxes in Dubrovnik/Split old towns are not.", "lim": "€400–1,000 per pull at bank machines.", "best": ["Zagrebačka banka", "PBZ", "Erste"], "tip": "Avoid the tourist-zone Euronet machines and their 'conversion'. Bank machines + euros = no drama."}, "Germany": {"fee": "Bank ATMs (Sparkasse, Volksbank, the big four) are surcharge-free; independent boxes charge €4–6.", "lim": "€500–1,000 per pull.", "best": ["Sparkasse", "Deutsche Bank", "Volksbank"], "tip": "Germany still loves cash — carry more than you'd expect; some Berlin bars and bakeries are cash-only. Bank ATMs, always."}, "Ireland": {"fee": "Bank ATMs are free for withdrawals; convenience-store machines may charge.", "lim": "€500–700 per pull typically.", "best": ["AIB", "Bank of Ireland", "PTSB"], "tip": "Charge in euros, never the home-currency option. Cards work everywhere; little cash needed."}, "Denmark": {"fee": "Bank ATMs are surcharge-free — but Denmark is nearly cashless, so you may never use one.", "lim": "2,000–5,000 kr per pull.", "best": ["Danske Bank", "Nordea", "Jyske Bank"], "tip": "Don't exchange money; MobilePay and cards run the country. A single small withdrawal covers flea markets."}, "Iceland": {"fee": "Bank ATMs (Landsbankinn, Íslandsbanki, Arion) are surcharge-free.", "lim": "Effectively your card's daily limit — high ceilings.", "best": ["Landsbankinn", "Íslandsbanki", "Arion banki"], "tip": "Iceland is the most cashless country you'll visit — cards work at remote petrol pumps and hot dog stands alike. Barely withdraw at all."}, "Switzerland": {"fee": "Bank ATMs (UBS, PostFinance, cantonal banks) add no surcharge; watch machines that quote in your home currency.", "lim": "CHF 500–1,000 per pull.", "best": ["PostFinance", "UBS", "Cantonal banks (ZKB etc.)"], "tip": "Everything's expensive, nothing's a scam. Pay in francs, decline conversion, and note many places take euros at a poor rate — francs win."}, "Mexico": {"fee": "Most bank ATMs charge a surcharge (~$3–6); Santander, Banorte and Scotiabank are usually the kindest. Avoid standalone tourist-zone machines.", "lim": "5,000–9,000 MXN per pull at most banks (some offer up to 12,000).", "best": ["Santander", "Banorte", "Scotiabank"], "tip": "Always withdraw in pesos and DECLINE the on-screen conversion. In tourist spots, use ATMs inside real bank branches, not the flashy 'no-fee' boxes in bars and lobbies (they gouge on the rate)."}, "Cuba": {"fee": "The system barely works for foreigners: many international cards (especially US-linked) are rejected, and ATMs are unreliable.", "lim": "Low and inconsistent when they work at all.", "best": ["(Bring cash — don't rely on ATMs)"], "tip": "Treat Cuba as cash-only: bring ALL the money you'll need in clean USD or EUR notes and exchange at official CADECA offices or your casa. Keep a reserve. Never rely on cards — plan the whole trip's budget in cash before you fly."}, "Guatemala": {"fee": "Bank ATMs charge ~$3–4 per withdrawal; 5B and Banrural machines are widely available.", "lim": "2,000–3,000 GTQ per pull typically.", "best": ["Banco Industrial", "5B network", "BAC"], "tip": "Withdraw inside banks or malls, not on the street. Antigua and Panajachel have plenty of ATMs; carry some cash for villages and chicken-buses where cards are useless. Quetzales only — decline conversion."}, "Nicaragua": {"fee": "ATMs charge ~$4–5 and can be scarce outside cities.", "lim": "Often capped around 6,000–8,000 NIO per pull.", "best": ["BAC", "Banpro", "LaFise"], "tip": "León and Managua have reliable bank ATMs (BAC is the most card-friendly). Carry enough córdobas/US cash for smaller towns; USD is often accepted. Withdraw in local currency and decline conversion."}, "Costa Rica": {"fee": "Bank ATMs charge modest fees; machines dispense both colones and USD.", "lim": "Usually ₡200,000 or a few hundred USD per pull.", "best": ["BAC", "Banco Nacional", "Scotiabank"], "tip": "Choose colones and DECLINE conversion. In remote surf towns (Santa Teresa!) ATMs are few and run dry on weekends — draw cash in a town with a bank branch before heading out. USD is widely accepted alongside colones."}, "Panama": {"fee": "ATMs charge ~$5–6 (a 'Servicio Bancario' fee) on most withdrawals.", "lim": "Often capped low ($250–500) which stacks the flat fee — withdraw the max.", "best": ["Banco General", "BAC", "Banistmo"], "tip": "Panama uses the US dollar (the 'balboa' is 1:1), so no exchange needed at all — just bring/withdraw USD. On Bocas islands, ATMs are few and can run out; carry enough cash over from the mainland."}, "Colombia": {"fee": "Most bank ATMs charge ~$3–5; Davivienda, Bancolombia and BBVA are reliable. Servibanca often lets you skip the fee.", "lim": "Bancolombia caps low (~600,000 COP); Davivienda and BBVA allow more per pull.", "best": ["Davivienda", "BBVA", "Servibanca"], "tip": "Withdraw inside malls or bank branches, cover the keypad, and take only what you need. Choose pesos, decline conversion. Medellín and Cartagena are full of ATMs; use the ones in guarded, indoor locations."}, "Venezuela": {"fee": "The local banking system is effectively unusable for foreign cards, and hyperinflation makes bolívares impractical.", "lim": "Not a viable option for travellers.", "best": ["(Use USD cash — not ATMs)"], "tip": "Venezuela runs on US dollars in cash now — bring clean, small-denomination USD notes and use them directly (widely accepted). Don't rely on ATMs or cards at all, don't flash cash, and change only tiny amounts to bolívares if ever needed. Cash discipline here is also a safety matter."}, "Ecuador": {"fee": "ATMs charge ~$4–5; Banco Pichincha and Banco Guayaquil are the widest networks.", "lim": "Often capped around $300–500 per pull.", "best": ["Banco Pichincha", "Banco Guayaquil", "Produbanco"], "tip": "Ecuador uses the US dollar — no exchange needed, just bring/withdraw USD and keep small bills ($20s and under; change is scarce). On the coast (Montañita) ATMs are limited and run dry — stock cash in Guayaquil first."}, "Peru": {"fee": "Most ATMs charge ~$4–6; BCP, Interbank and Scotiabank are reliable and dispense soles or USD.", "lim": "BCP/Interbank often allow up to 700–1,000 PEN; some cap lower.", "best": ["BCP", "Interbank", "Scotiabank"], "tip": "Withdraw soles and DECLINE conversion. Use ATMs inside banks/malls, especially in Cusco's tourist centre. Globalnet standalone machines charge more — prefer the bank-branded ones. Carry small notes for markets and menús."}, "Chile": {"fee": "Chilean ATMs are notorious for high foreign-card fees ($6–8) and often ask an intimidating 'foreign card' surcharge screen.", "lim": "Often capped at 200,000 CLP per pull (some banks more).", "best": ["Banco de Chile", "Santander", "Scotiabank"], "tip": "Withdraw the maximum to dilute the flat fee, and choose pesos while declining conversion. Some travellers find Scotiabank and BancoEstado kinder. Chile is card-friendly, so you need less cash than you'd think."}, "Bolivia": {"fee": "ATMs charge modest fees but can be finicky with foreign cards — carry a backup card.", "lim": "Often capped around 1,500–2,000 BOB per pull.", "best": ["Banco Nacional (BNB)", "Banco Mercantil", "BCP Bolivia"], "tip": "Try a few banks if one rejects your card (common). Withdraw bolivianos, decline conversion, and keep small notes — change is scarce. Use ATMs in daylight inside branches; La Paz has plenty in Sopocachi and the centre."}, "Argentina": {"fee": "AVOID ATMs here: they charge brutal fees ($10+), cap withdrawals painfully low, and give the poor official rate.", "lim": "Often just 15,000–40,000 ARS per pull — dreadful value with the fee.", "best": ["(Bring USD cash — see tip)"], "tip": "Argentina is the big exception: bring clean USD cash and change it at the favourable 'blue'/MEP-linked rate (via Western Union payout or trusted cambios), which can nearly DOUBLE your money versus ATMs. Many cards now also bill at the better MEP rate — check yours. Cash is king; plan ahead."}, "Brazil": {"fee": "Use Banco24Horas, Bradesco, Santander or Banco do Brasil; many other machines block foreign cards or charge heavily. ~$5–6 typical.", "lim": "Often capped around R$1,000–1,500 (lower at night for security).", "best": ["Banco24Horas", "Bradesco", "Santander"], "tip": "Withdraw by day inside banks/malls (night limits drop for safety), choose reais, decline conversion. Brazil is very card/Pix-friendly, so carry only modest cash — 'beach money' for the sand, card for the rest."}, "China": {"fee": "Foreign cards work at Bank of China, ICBC and big-bank ATMs (~¥15–30 fee), but China is almost entirely cashless via mobile pay.", "lim": "Usually ¥2,000–3,000 per pull.", "best": ["Bank of China", "ICBC", "China Construction Bank"], "tip": "Set up Alipay or WeChat Pay with a foreign card BEFORE you go — you'll pay for nearly everything by QR, and cash is increasingly refused. Keep a little cash as backup and withdraw at major bank branches. Decline conversion."}, "Japan": {"fee": "Use 7-Eleven (7-Bank) and Japan Post Bank ATMs — they reliably accept foreign cards with low/no surcharge. Many other ATMs reject foreign cards.", "lim": "¥50,000–100,000 per pull typically.", "best": ["7-Eleven (7-Bank)", "Japan Post Bank", "Aeon"], "tip": "Japan is still surprisingly cash-based for a rich country — carry more yen than you'd expect. 7-Eleven ATMs are your reliable friend, open 24/7 in every konbini. Decline conversion; pay in yen."}, "South Korea": {"fee": "Look for 'Global ATM' signs (at convenience stores, banks); those take foreign cards for ~₩3,500. Many domestic-only ATMs won't.", "lim": "₩300,000–1,000,000 per pull.", "best": ["Global ATM (KEB Hana)", "Woori Bank", "Shinhan Bank"], "tip": "A transit card (T-money) and a card cover most of life. Use 'Global ATM'-marked machines for cash, decline conversion, and keep some won for markets and older eateries."}, "Cambodia": {"fee": "ATMs charge a flat $4–6 and, usefully, dispense US dollars (the de facto currency).", "lim": "Often $500 per pull; some allow more.", "best": ["ABA Bank", "Acleda", "Canadia Bank"], "tip": "Cambodia runs on US dollars — bring/withdraw clean USD and you'll rarely need riel (used only for small change). ABA has the best app and machines. Keep small, unmarked bills; torn notes get refused."}, "Laos": {"fee": "ATMs charge ~20,000–30,000 kip per withdrawal with low limits.", "lim": "Often just 1–2 M kip per pull — withdraw the max to dilute the fee.", "best": ["BCEL", "Lao Development Bank", "JDB"], "tip": "Bring some USD or Thai baht as backup (widely accepted for larger bills). BCEL has the widest ATM network. Kip for everyday spends; decline conversion. Cash is king in laid-back Laos."}, "Sri Lanka": {"fee": "ATMs charge ~₨400–600 per withdrawal; Commercial Bank and Sampath are reliable for foreign cards.", "lim": "Often ₨40,000–100,000 per pull.", "best": ["Commercial Bank", "Sampath Bank", "HNB"], "tip": "Withdraw rupees at bank ATMs in towns (Ella's are limited — stock up in Kandy/Colombo). Use the PickMe app for fair tuk-tuk fares. Decline conversion; keep small notes."}, "Nepal": {"fee": "ATMs charge a flat ~₨500 (Nepali) per withdrawal with lowish limits.", "lim": "Often ₨10,000–35,000 per pull (Nabil/Himalayan allow more).", "best": ["Nabil Bank", "Himalayan Bank", "Standard Chartered"], "tip": "Withdraw the maximum to dilute the flat fee. Pokhara's Lakeside has plenty of ATMs. Carry cash for trekking (no ATMs on the trails) and small notes for tea houses. Decline conversion."}, "Australia": {"fee": "Big-four bank ATMs (CommBank, Westpac, NAB, ANZ) are surcharge-free for withdrawals; standalone machines in pubs/shops charge $2–3.", "lim": "Usually A$1,000–2,000 per pull.", "best": ["CommBank", "Westpac", "ANZ / NAB"], "tip": "Australia is heavily card/tap — you'll barely need cash. Use big-four bank ATMs to avoid fees, tap for everything else, and always decline the currency conversion."}, "New Zealand": {"fee": "Bank ATMs (ANZ, ASB, BNZ, Westpac) are surcharge-free for withdrawals.", "lim": "Usually NZ$1,000–2,000 per pull.", "best": ["ANZ", "ASB", "BNZ / Westpac"], "tip": "NZ is almost entirely card/PayWave — cash is rarely needed. Draw from bank ATMs if you want some, tap for the rest, and decline conversion (pay in NZ dollars)."}}, "health": {"Thailand": {"vax": "Routine shots up to date, plus Hepatitis A and (for street-food adventurers) Typhoid. Rabies and Japanese encephalitis only for long rural stays — a travel clinic will tell you in five minutes.", "health": "Dengue mosquitoes bite at dawn and dusk — repellent is the one habit that matters. Skip tap water (sealed bottles and purified ice are everywhere); busy stalls with turnover are the safe street food. Private hospitals are world-class and affordable — Bangkok is where the region flies for treatment.", "water": "❌ Don't drink the tap. Sealed bottled water is cheap and everywhere; ice in established places is factory-made and fine.", "safe": "Violent crime against visitors is genuinely rare — the real risk wears two wheels: traffic. Helmet on every scooter, Grab at night, and you've handled 90 % of it. Classic scams (gem shops, 'closed temple' tuk-tuks) are annoyances, not dangers — a smile and a walk-on solves them.", "er": "191 police · 1669 ambulance · 1155 tourist police (English)"}, "Malaysia": {"vax": "Routine plus Hepatitis A; Typhoid if you'll eat adventurously (you should).", "health": "Dengue is present — repellent at dusk. Most locals drink filtered water; do the same. Private healthcare (KL, Penang) is excellent and inexpensive; pharmacies dispense competently everywhere.", "water": "⚠️ Officially treated but most locals boil or filter it — stick to bottled or filtered to be safe.", "safe": "One of Southeast Asia's calmest countries. The single habit to build: carry bags on the building side of the pavement — motorbike snatch theft is the local specialty, easily beaten. East-coast islands close in the Nov–Feb monsoon; the west coast (Penang!) shines year-round as your alternative.", "er": "999 all emergencies"}, "Vietnam": {"vax": "Routine, Hepatitis A, Typhoid. Rabies awareness around street dogs — don't pet, and any bite means a clinic same-day.", "health": "Bottled water, cooked food, repellent for dengue — the classic tropical trio. International clinics (Vinmec, Family Medical) in Hanoi, Da Nang and Saigon are excellent.", "water": "❌ Not safe to drink. Bottled only; refill stations exist in tourist towns to cut plastic.", "safe": "Extremely low violent crime. The famous hazard is crossing the street: walk out slowly, keep a steady pace, and the motorbike river flows around you — it genuinely works. Phone-snatching from motorbikes exists in Saigon: hold it away from the curb.", "er": "113 police · 115 ambulance"}, "Indonesia": {"vax": "Routine, Hepatitis A, Typhoid. Bali has rabies in dogs and monkeys — admire, don't touch; any scratch (looking at you, Monkey Forest) means a clinic that day.", "health": "'Bali belly' is mostly avoidable: sealed water, hot cooked food, peeled fruit. One serious rule with a simple fix: drink only sealed, branded spirits — informal arak has caused methanol poisonings. On Gili Air, cuts from coral are the main 'injury' — pack reef shoes and antiseptic. BIMC and Siloam hospitals in Bali are solid.", "water": "❌ Never drink the tap (Bali belly's main culprit). Sealed bottles only; on Gili Air, carry enough over.", "safe": "Homicide rates here are among the world's lowest — day-to-day Bali and the Gilis feel gentler than most European cities. Petty theft from parked scooters is the main nuisance: use the seat lock. Volcanoes occasionally grumble; if Agung is active, flights reroute and the authorities are well-drilled.", "er": "112 general · 118 ambulance"}, "Philippines": {"vax": "Routine, Hepatitis A, Typhoid; rabies awareness with strays.", "health": "Bottled water, repellent for dengue, sunscreen like it's a job — the tropics' honest checklist. City private hospitals (Cebu Doctors', Chong Hua) are good; island clinics are basic, so travel insured.", "water": "⚠️ Metro Manila and Cebu tap is chlorinated but most drink bottled/purified; on islands, always bottled.", "safe": "The tourist islands — Boracay, Bohol, Cebu's resorts — run calm and heavily hosted; violence involving visitors is rare there. National statistics look higher than your actual itinerary: the areas driving them (far southwest Mindanao) are 500+ km from anywhere on this site. Typhoon season is Jun–Nov; Dec–May is your blue-sky alternative.", "er": "911 nationwide"}, "North Macedonia": {"vax": "Routine only. Hikers doing Pelister forests in spring–summer: ask about tick-borne encephalitis and wear long trousers on trails.", "health": "Tap water in Skopje, Ohrid and Bitola is safe and good. Pharmacies are plentiful; EU-standard care is a short hop away.", "water": "✅ Safe and good — Skopje, Ohrid and Bitola tap water is clean mountain supply. Drink freely.", "safe": "Homicide ~1 per 100k — safer than most of Western Europe's big cities. Ohrid in August is crowded, not dangerous; the only 'risk' worth planning around is Skopje's winter smog — visit May–October and it's moot.", "er": "112 (or 192 police · 194 ambulance)"}, "Serbia": {"vax": "Routine only; tick-borne encephalitis shot for serious forest hikers.", "health": "Belgrade and Novi Sad tap water: drink it. Healthcare is competent; private clinics quick and cheap.", "water": "✅ Safe in Belgrade and Novi Sad — city tap water is fine to drink.", "safe": "Belgrade at 3 am is famously relaxed — violent street crime toward visitors is rare (~1/100k homicide). The one date to plan around: derby football nights (Partizan–Red Star), when stadium districts get rowdy — the kafanas across town are your better evening anyway.", "er": "112 (192 police · 194 ambulance)"}, "Montenegro": {"vax": "Routine only.", "health": "Tap water is fine on the coast. Summer sun is fierce on those white stone streets — hats and water. At Ada Bojana, swim the lagoon side with kids; where river meets sea the current is honest.", "water": "✅ Coastal tap water is safe to drink; refill and skip the bottles.", "safe": "Coastal Montenegro is small-town safe (~2/100k). The genuine risk is the roads: twisty, dramatic, occasionally shared with confident drivers — take the bus at night and it's solved. August crowds are the other 'hazard'; June and September are the same sea, calmer.", "er": "112"}, "Egypt": {"vax": "Routine, Hepatitis A, Typhoid.", "health": "Bottled water only, and give your stomach two gentle days before the buffet victory lap. The Red Sea repays respect: reef shoes, no touching coral, and dive only with CDWS-listed shops. Sun is desert-serious — hydrate beyond thirst.", "water": "❌ Don't drink the tap, and skip loose ice outside good hotels. Bottled water only — check the seal.", "safe": "Hurghada's resort coast is one of the most heavily protected tourist zones anywhere — petty crime is notably rare. The advisories you'll read concern North Sinai, a full country-width away from the Red Sea resorts. Haggling theatrics are the local sport; play or smile-decline, both work.", "er": "122 police · 123 ambulance · 126 tourist police"}, "Mauritius": {"vax": "Routine; dengue appears in occasional outbreaks — repellent in wet season (Nov–Apr).", "health": "Water is officially treated; most visitors drink bottled after cyclones stir the pipes. On rocky lagoon entries wear water shoes (stonefish are rare but real). Clinics are good; Apollo Bramwell-class private care exists.", "water": "⚠️ Officially treated and generally safe, but many visitors prefer bottled after cyclones stir the supply.", "safe": "One of Africa's safest countries by every index — families wander night markets without a thought. Beach rule: don't leave bags unattended while you swim. Cyclone season peaks Jan–Feb; May–Dec is your serene alternative.", "er": "999 police · 114 ambulance"}, "Czechia": {"vax": "Routine. Forest hikers: Czechia is a tick-borne encephalitis hotspot — the vaccine is worth asking about for countryside trips; city breaks need nothing.", "health": "Tap water excellent. Pharmacies (lékárna) are everywhere and capable.", "water": "✅ Excellent — Prague tap water is high quality. Bring a refillable bottle.", "safe": "Prague's violent-crime rate is among Europe's lowest (~0.7/100k). The entire risk profile is pickpockets on Old Town Square, Charles Bridge and tram 22 — front pockets, zipped bags, done. That, and the exchange kiosks we've already banned you from.", "er": "112"}, "Slovakia": {"vax": "Routine; tick-borne encephalitis for Tatra hikers.", "health": "Tap water excellent, healthcare solid.", "water": "✅ Excellent and safe straight from the tap.", "safe": "Bratislava is a small, calm capital — the statistics barely register. Weekend stag groups are louder than any local danger; two streets away is silence.", "er": "112"}, "Romania": {"vax": "Routine; tick-borne encephalitis for Carpathian hikes.", "health": "City tap water is treated (many prefer bottled for taste). Stray dogs in outskirts: don't engage, carry on. Private clinics (Regina Maria, MedLife) are quick and inexpensive.", "water": "✅ City tap water is treated and safe; many prefer bottled purely for taste.", "safe": "Bucharest is statistically safer than Paris or Brussels for violent crime. Old-town clip joints and 'meter' taxis are the actual traps — both die instantly to apps and our restaurant rules. Peleș and the mountains: standard hiking sense.", "er": "112"}, "Poland": {"vax": "Routine; tick-borne encephalitis if you'll do eastern forests.", "health": "Tap water fine, pharmacies (apteka) superb.", "water": "✅ Safe to drink across the country; Gdańsk tap is good.", "safe": "Gdańsk and the Tricity are Baltic-calm (~0.7/100k nationally). Summer weekend party crowds in Sopot are boisterous, not threatening. The Baltic itself is the thing to respect: swim at flagged beaches; that sea is colder and stronger than it looks.", "er": "112"}, "Estonia": {"vax": "Routine; the Baltics have real tick-borne encephalitis — vaccine worthwhile if bog-walks and forests are on your list.", "health": "Tap water excellent; e-health so advanced your prescription is a QR code.", "water": "✅ Excellent, safe, and among Europe's cleanest — drink from the tap.", "safe": "Tallinn ranks among the EU's safest capitals. Winter's real hazard is horizontal: icy pavements — pack grippy soles, walk like a penguin, and you've mastered Estonian winter safety.", "er": "112"}, "Latvia": {"vax": "Routine; tick-borne encephalitis for forest and Jūrmala-dune wanderers.", "health": "Tap water fine; pharmacies everywhere.", "water": "✅ Safe to drink; Riga's supply is fine straight from the tap.", "safe": "Rīga's old town is peaceful; the historical 'gentlemen's bar' bill-trap is the one local scam — stick to listed venues (our rule already). Winter ice, same penguin protocol as Tallinn.", "er": "112"}, "Italy": {"vax": "Routine only.", "health": "Tap water is excellent — Milan's is alpine. Pharmacies (farmacia) handle minor everything. August heat in Florence is real: museums at noon, piazzas at dusk.", "water": "✅ Excellent everywhere — Rome's 'nasoni' street fountains are free, safe and delicious. Refill constantly.", "safe": "Violent crime toward visitors: statistically tiny. Pickpocketing near Milano Centrale, the Duomo and Florence's buses is professional-grade — money in front pockets, backpacks worn forward on transit, and you're invisible to them. That's the whole briefing.", "er": "112"}, "France": {"vax": "Routine only.", "health": "Tap water fine (ask for 'une carafe d'eau' — it's free). Pharmacies are French national treasures.", "water": "✅ Safe nationwide — ask for 'une carafe d'eau' free at any restaurant.", "safe": "Paris is far safer than its reputation among people who watch too much news (~1.2/100k). Métro lines 1 and 4 and the Sacré-Cœur steps host Europe's most artistic pickpockets — phone in pocket before the doors open. The gold-ring and petition performers are street theatre; keep walking, enjoy the show.", "er": "112"}, "Belgium": {"vax": "Routine only.", "health": "Tap water fine; excellent healthcare.", "water": "✅ Safe to drink from the tap everywhere.", "safe": "Brussels' tourist core is calm; Gare du Midi arrivals is the one pickpocket hotspot — bag zipped, then waffles. Late-night around the station district: take a cab like a local would.", "er": "112"}, "United Kingdom": {"vax": "Routine only.", "health": "Tap water great; pharmacies and NHS walk-in centres handle traveller mishaps. Edinburgh weather is the health hazard: four seasons before lunch — layer.", "water": "✅ Excellent and safe — Edinburgh tap water is soft and clean. Refill freely.", "safe": "Edinburgh is one of the UK's safest cities. Weekend Cowgate gets merry rather than menacing; licensed cabs home and it's a non-topic. Arthur's Seat in proper shoes, not after the third whisky.", "er": "999 or 112"}, "Portugal": {"vax": "Routine only.", "health": "Tap water fine. The Atlantic is the one force to respect: swim at flagged beaches — those currents are honest even in July.", "water": "✅ Safe to drink; coastal areas can taste faintly of chlorine but it's fine.", "safe": "Portugal sits in the global top-10 of the Peace Index — one of the safest countries you can visit, full stop. Tram 28 pickpockets and the friendly 'hash?' oregano salesmen of Lisbon are the entire threat landscape. Both are beaten by a zipped bag and a smile.", "er": "112"}, "Spain": {"vax": "Routine only.", "health": "Tap water fine everywhere on our list (coastal areas vary in taste, not safety). July–August heat inland (Sevilla, Madrid!) is genuinely fierce — siesta culture exists for a reason; May–June and Sept–Oct are golden alternatives.", "water": "✅ Safe nationwide (Madrid's is famously good); some coastal spots taste briny but remain safe.", "safe": "Violent crime toward visitors: among Europe's lowest. Barcelona is, however, the continent's pickpocket capital — Las Ramblas, metro L3, and beach bags are the arenas. Phone gripped, bag worn forward, nothing valuable on the sand: play that defense and Spain is pure joy.", "er": "112"}, "Norway": {"vax": "Routine only.", "health": "Tap water is some of the world's best. Real risks live outdoors: weather turns fast on hikes (check yr.no religiously, tell someone your route), and fjord water is arrestingly cold year-round.", "water": "✅ Among the world's best — drink straight from any tap with pride.", "safe": "Statistically among the safest countries on Earth. Oslo's east-side nightlife districts are lively, not dangerous. Your genuine adversaries: hiking weather and the bar tab.", "er": "112 police · 113 ambulance"}, "Sweden": {"vax": "Routine; tick-borne encephalitis if you'll do southern-coast forests or the archipelago in summer.", "health": "Tap water superb; healthcare excellent (bring your EHIC/GHIC if European).", "water": "✅ Superb, safe, and free everywhere — no need to ever buy bottled.", "safe": "The gang-related incidents in Swedish headlines happen in outer suburbs with no tourist presence whatsoever — central Stockholm, Gothenburg and Malmö rank with Europe's calmest city centres for visitors. Winter ice and summer boat-beers-swimming combos deserve more caution than any street.", "er": "112"}, "Finland": {"vax": "Routine; tick-borne encephalitis for Åland/coastal summer wanderers.", "health": "Tap water is a national pride; pharmacies (apteekki) excellent.", "water": "✅ A national pride — some of the cleanest tap water on Earth. Refill anywhere.", "safe": "Finland is routinely ranked the world's happiest and among its safest — Helsinki's biggest danger is buying more Marimekko than your luggage allows. Winter: ice grips for shoes, and never walk on sea ice without locals doing it first.", "er": "112"}, "United States": {"vax": "Routine only.", "health": "Tap water fine. The health story here is financial: US care is superb and staggeringly expensive — travel insurance isn't optional, it's the trip's most important booking. Sun and rip currents: swim near lifeguard flags, always.", "water": "✅ Tap water is safe and free — ask for it at any restaurant. Refill stations are common.", "safe": "Miami's beaches and tourist districts are heavily patrolled and busy till late. American city safety is block-by-block: stay where the people are, rideshare after midnight rather than wandering, and it's a normal big-city visit. Hurricane season Jun–Nov; Dec–Apr is the postcard window.", "er": "911"}, "Dominican Republic": {"vax": "Routine, Hepatitis A, Typhoid; repellent for dengue.", "health": "Bottled water; resort food is fine, street food from busy spots. Pack rehydration salts — the sun does the rest of the talking.", "water": "❌ Don't drink the tap. Bottled water only, even at many resorts (they'll provide it).", "safe": "The Punta Cana resort corridor has its own tourist police force (CESTUR) and runs very calm. Book excursions with licensed operators, skip moto-taxis after dark, keep resort-safe habits with valuables — standard Caribbean sense. Hurricane peak Aug–Oct; Dec–Apr is prime.", "er": "911"}, "Netherlands": {"vax": "Routine only.", "health": "Tap water excellent. The genuine hazard is the bike lane — look both ways twice, never walk in the red-paved lanes.", "water": "✅ Excellent and strictly regulated — drink freely from any tap.", "safe": "Amsterdam is very safe (~1/100k). Pickpockets work Centraal and the crush around the Red Light District; bikes will run you over before any criminal will. The 'coffeeshop' rules are legal but city-specific — read the signs.", "er": "112"}, "Austria": {"vax": "Routine; tick-borne encephalitis for alpine hikers.", "health": "Tap water is alpine-pure. Vienna's healthcare is world-class.", "water": "✅ Alpine-pure — Vienna's tap water flows straight from the mountains. Superb.", "safe": "Vienna is routinely named among the world's safest and most liveable cities. The whole risk profile is transit pickpockets around Stephansplatz — zip your bag and relax.", "er": "112"}, "Hungary": {"vax": "Routine; tick-borne encephalitis for forest hikers.", "health": "Budapest tap water is excellent; the thermal baths are a health feature, not a hazard (shower first, hydrate after).", "water": "✅ Budapest tap water is safe and good; refill your bottle.", "safe": "Budapest is a safe capital (~1/100k). The real traps are financial: rigged taxis (use Bolt), inflated 'ruin bar' tabs, and the old exchange-kiosk scam — all beaten by our standing rules.", "er": "112 (or 112)"}, "Greece": {"vax": "Routine, plus Hepatitis A for wider eating.", "health": "Tap water is safe in Athens; on many islands it's brackish — locals drink bottled, so do the same. Summer sun and meltemi wind are fierce; hydrate and respect ferry cancellations.", "water": "⚠️ Safe in Athens and the mainland; on many islands it's brackish or unreliable, so locals drink bottled — do the same there.", "safe": "Greece is very safe for visitors (~1/100k). Athens' Omonia and Exarcheia get edgier at night; the islands are family-gentle. Watch bags on the crowded metro to the Acropolis.", "er": "112"}, "Croatia": {"vax": "Routine; tick-borne encephalitis for continental forest hikes.", "health": "Tap water is excellent countrywide. On rocky Adriatic entries wear water shoes (sea urchins). Sun is strong on the white stone.", "water": "✅ Excellent countrywide, including Dubrovnik and Split — drink from the tap.", "safe": "One of Europe's safest countries — Dubrovnik and Split feel effortlessly calm. Old-town crowds in summer are the only 'crush'. Swim shoes and shade are the real advisories.", "er": "112"}, "Germany": {"vax": "Routine; tick-borne encephalitis for southern forests.", "health": "Tap water excellent, pharmacies (Apotheke) superb.", "water": "✅ Safe and high quality everywhere (Leitungswasser); Berlin's is fine to drink.", "safe": "Berlin is safe and famously easygoing (~1/100k). Pickpockets favour Alexanderplatz, Warschauer and the U-Bahn; that's the extent of it. Look left for cyclists before you step off any kerb.", "er": "112"}, "Ireland": {"vax": "Routine only.", "health": "Tap water fine; Dublin's weather is the health story — layer, it rains sideways.", "water": "✅ Safe to drink nationwide; Dublin tap water is fine.", "safe": "Dublin is friendly and broadly safe; late-night around parts of the north inner city and the boardwalk can feel edgy — stick to busy streets and taxi home. Pickpockets work Grafton Street crowds.", "er": "112 or 999"}, "Denmark": {"vax": "Routine only.", "health": "Tap water superb; healthcare excellent.", "water": "✅ Excellent — Copenhagen tap water is clean and safe. Skip bottled.", "safe": "Copenhagen is one of the world's safest capitals — kids cycle everywhere. The only real rule is bike-lane awareness. Christiania has its own etiquette: no photos on Pusher Street.", "er": "112"}, "Iceland": {"vax": "Routine only.", "health": "Tap water is glacial and perfect (skip bottled entirely). The hazards are natural: sudden weather, unfenced cliffs, geothermal-hot ground, and rip currents at Reynisfjara's black beach — heed every sign.", "water": "✅ Some of the purest on Earth — glacial and free. Never buy bottled here; it's a tourist trap.", "safe": "Iceland is statistically the safest country on Earth (near-zero violent crime). Your only genuine adversaries are the weather and your own selfie confidence near cliffs and waves. Check road.is and safetravel.is.", "er": "112"}, "Switzerland": {"vax": "Routine; tick-borne encephalitis for alpine hikers.", "health": "Tap water is drinkable everywhere, even most mountain fountains. Care is superb and famously expensive — insure well. Altitude on peak excursions is real.", "water": "✅ Superb and drinkable everywhere, including most labelled mountain fountains. Refill constantly.", "safe": "Switzerland is among the safest countries anywhere. Zürich's nightlife district (Langstrasse) is the one livelier corner. Mountain weather and expensive mistakes are the actual risks.", "er": "112 (117 police · 144 ambulance)"}, "Mexico": {"vax": "Routine, Hepatitis A, Typhoid. Rabies awareness for long rural stays.", "health": "Stick to bottled/purified water; the 'agua purificada' garrafón is everywhere. Street food from busy stalls with turnover is the safe kind. Altitude in Mexico City (2,240m) can wind you the first day. Private hospitals in cities are excellent and affordable.", "water": "❌ Don't drink the tap. Bottled/purified 'agua purificada' is universal and cheap; good restaurants use it for ice too.", "safe": "Your itinerary matters more than the national headlines. Tourist Yucatán (Mérida is among Mexico's safest cities), Oaxaca and CDMX's central neighbourhoods run calm and busy. Use Uber/Didi over street cabs, ATMs inside banks/malls, and skip flashy valuables. The cartel-linked violence that drives statistics is concentrated in specific states far from these places.", "er": "911 nationwide"}, "Cuba": {"vax": "Routine, Hepatitis A; Typhoid for wider eating. Bring any prescription meds you need — pharmacies are sparsely stocked.", "health": "Drink bottled water only. Carry your own basics (painkillers, rehydration salts, sunscreen) — shortages are real and shops may simply not have them. Tourist clinics (Cira García in Havana) serve foreigners for cash.", "water": "❌ Don't drink the tap. Bottled water can itself be scarce — buy it when you see it and keep a reserve.", "safe": "One of Latin America's safest countries for visitors — violent crime is rare and tourists are generally left in peace. The real challenges are practical: cash-only economy, shortages of food/fuel/medicine, and long queues. Petty scams (rigged taxis, 'closed' restaurants steering you elsewhere) are the main annoyance.", "er": "106 police · 104 ambulance"}, "Guatemala": {"vax": "Routine, Hepatitis A, Typhoid. Rabies awareness rurally; malaria pills only for low-lying jungle stays (not Antigua/Atitlán highlands).", "health": "Bottled/purified water only. Antigua and Atitlán sit at altitude (1,500m+), so cooler and gentler on the stomach. Volcano hikes need real shoes and a guide. Antigua has decent private clinics; serious cases go to Guatemala City.", "water": "❌ Don't drink the tap. Purified 'agua pura' is cheap and everywhere.", "safe": "Antigua and Lake Atitlán are the well-trodden traveller circuit and feel relaxed and hosted; Guatemala City is best transited quickly. Use tourist shuttles or Uber in the capital, don't hike volcanoes solo, and keep valuables low-key. Chicken buses are colourful but pickpocket-prone.", "er": "110 police · 122 / 123 ambulance"}, "Nicaragua": {"vax": "Routine, Hepatitis A, Typhoid. Dengue present — repellent; malaria pills only for remote lowlands.", "health": "Bottled/purified water. León is hot and low — hydrate hard and sunscreen up. Volcano boarding is a blast but wear the gear. Private clinics in León and Managua handle basics; travel insured for anything serious.", "water": "❌ Don't drink the tap. Purified water is cheap and easy to find.", "safe": "Historically one of the region's safest for travellers, with low violent crime. Note the political situation can bring occasional demonstrations — avoid protests and check current advisories before you go. Otherwise standard petty-theft sense covers it.", "er": "118 police · 128 ambulance"}, "Costa Rica": {"vax": "Routine, Hepatitis A; Typhoid for wider eating. Dengue on both coasts — repellent.", "health": "Tap water is actually safe to drink in most of the country including San José — a Central American rarity. Rip currents on both coasts are the real hazard: swim at flagged beaches, respect the ocean. Excellent private hospitals (CIMA, Clínica Bíblica).", "water": "✅ Safe to drink in most of the country, including cities and most beach towns — a regional exception. In very remote spots, ask locally.", "safe": "One of Latin America's safest and most visitor-ready countries ('pura vida' is real). Petty theft from cars and beaches is the main issue — never leave anything visible in a rental, use lockers. Santa Teresa and Puerto Viejo are laid-back surf towns; standard beach-town smarts apply.", "er": "911 nationwide"}, "Panama": {"vax": "Routine, Hepatitis A; Typhoid for wider eating. Dengue present; yellow-fever shot only if heading to Darién (not Bocas or the city).", "health": "Panama City tap water is safe to drink; on Bocas del Toro islands drink bottled. Caribbean sun and reef cuts are the Bocas hazards — reef shoes, sunscreen. Panama City has first-rate private hospitals (Punta Pacífica).", "water": "⚠️ Safe in Panama City; on Bocas del Toro and remote islands, drink bottled.", "safe": "Panama City and Bocas del Toro are calm and tourist-friendly. Standard city sense in the capital (Uber, ATMs indoors); Bocas is a mellow island-hopper's town. Avoid the Darién Gap entirely — it's a genuine no-go, nowhere near your route.", "er": "911 nationwide"}, "Colombia": {"vax": "Routine, Hepatitis A, Typhoid. Yellow-fever shot recommended for Cartagena/coast and required for some parks — get it 10 days ahead.", "health": "Bottled/purified water (Medellín's tap is actually potable and good). Cartagena's Caribbean heat is intense — hydrate and pace. Excellent, affordable private healthcare, especially in Medellín (a medical-tourism hub).", "water": "⚠️ Medellín and Bogotá tap water is safe and good; on the Caribbean coast (Cartagena) stick to bottled.", "safe": "'No dar papaya' is the local rule — don't flash anything worth stealing and you remove most risk. Medellín's El Poblado/Laureles and Cartagena's walled city and Getsemaní are geared for visitors and feel relaxed by day. Use Uber/inDrive, ATMs indoors, and don't wander empty streets late. Scopolamine ('devil's breath') scams are real — never accept drinks or cigarettes from strangers.", "er": "123 nationwide"}, "Venezuela": {"vax": "Routine, Hepatitis A, Typhoid. Yellow-fever shot recommended; malaria pills for some regions. Bring all your own medicines — pharmacies are severely under-stocked.", "health": "Bottled water only, and carry a full personal medical kit; the healthcare system is in crisis and shortages of medicines are severe. Serious issues mean private clinics (cash/USD) or medical evacuation — insure specifically for Venezuela.", "water": "❌ Don't drink the tap. Bottled water is essential and worth stocking up when available.", "safe": "Be honest with yourself here: Caracas has among the world's highest crime rates, and most governments advise heightened caution or reconsidering non-essential travel. If you go, go with local contacts or a trusted guide, don't walk with a phone out, avoid the city after dark, use only arranged transport (not street taxis), and keep a very low profile. Check your government's advisory carefully before booking — this is the one destination on Sama·Sama where that step isn't optional.", "er": "911 · 171 (service varies)"}, "Ecuador": {"vax": "Routine, Hepatitis A, Typhoid. Yellow-fever shot for Amazon regions (not coastal Montañita). Malaria pills only for jungle lowlands.", "health": "Bottled/purified water. Coastal Montañita is hot and sunny — hydrate, sunscreen, and respect the surf. Altitude matters if you combine with Quito (2,850m). Guayaquil has the nearest good hospitals to the coast.", "water": "❌ Don't drink the tap. Purified water is cheap and everywhere.", "safe": "Ecuador has seen rising crime in some cities (notably Guayaquil), so check current advisories. Montañita itself is a small, laid-back surf-party town — the usual beach-town sense covers it: watch valuables, don't walk the beach alone very late, moderate the party. Use registered taxis or Uber/inDrive.", "er": "911 nationwide"}, "Peru": {"vax": "Routine, Hepatitis A, Typhoid. Yellow-fever shot for Amazon (not Cusco/coast). Rabies awareness for long rural stays.", "health": "Bottled/purified water only. Cusco sits at 3,400m — altitude sickness is real: arrive slow, hydrate, coca tea helps, consider acetazolamide. Máncora on the coast is hot and low. Cusco has clinics used to altitude cases; Lima has top hospitals.", "water": "❌ Don't drink the tap. Purified water is cheap; at altitude, hydration matters even more.", "safe": "The Gringo Trail (Cusco, Sacred Valley, Máncora) is well-worn and generally safe. Cusco is very tourist-geared; watch bags in crowds and use registered taxis or Uber. Máncora is a mellow surf town with standard beach-town smarts. Don't hike remote trails solo without a guide.", "er": "105 police · 106 ambulance"}, "Chile": {"vax": "Routine; Hepatitis A for wider eating. One of the region's lowest health-risk countries.", "health": "Tap water is safe to drink in Valparaíso and Santiago (it can be very mineral-heavy, so some prefer bottled for taste). Excellent healthcare. Strong Pacific sun and cool ocean — the Humboldt current makes beaches chilly.", "water": "✅ Safe to drink in Valparaíso and central Chile (high mineral content — some prefer bottled for taste, not safety).", "safe": "Chile is among South America's safest and most developed countries. Valparaíso is characterful but has rougher hillside pockets — stay on the tourist cerros (Alegre, Concepción), watch your phone in crowds, and take registered taxis/Uber at night. Petty theft is the main concern, not violence.", "er": "133 police · 131 ambulance"}, "Bolivia": {"vax": "Routine, Hepatitis A, Typhoid. Yellow-fever shot for lowland/Amazon regions. Rabies awareness rurally.", "health": "Bottled/purified water only. La Paz is extreme altitude (3,600m, El Alto higher) — take the first day very slow, hydrate, mate de coca helps a lot. Clinics in La Paz handle altitude routinely; serious cases may need descent or evacuation.", "water": "❌ Don't drink the tap. Purified water is cheap; altitude makes hydration essential.", "safe": "Bolivia is relatively safe for travellers with mostly petty crime. In La Paz use radio taxis or apps (not random street cabs — 'express kidnapping' scams exist), keep bags close in markets, and beware fake-police scams (real police never demand to see your money or search you in the street). Protests can block roads — build in flexibility.", "er": "110 police · 118 ambulance"}, "Argentina": {"vax": "Routine; Hepatitis A for wider eating. Low health risk overall.", "health": "Buenos Aires tap water is safe to drink. Excellent private healthcare. The main 'health' event is eating steak and drinking Malbec at 10pm like a local — pace yourself.", "water": "✅ Safe to drink in Buenos Aires and major cities.", "safe": "Buenos Aires is a big, late-night European-feeling city — generally safe in the tourist barrios (Palermo, Recoleta, San Telmo, Puerto Madero) but with real petty theft and phone-snatching. Keep your phone off the table on the street, use Uber/Cabify, and change money smartly (see the cash tab — the 'blue' rate matters here). La Boca only by day, main streets only.", "er": "911 (or 101 police · 107 ambulance)"}, "Brazil": {"vax": "Routine, Hepatitis A, Typhoid. Yellow-fever shot is recommended for much of Brazil incl. Rio state — get it 10 days before travel. Dengue present; repellent.", "health": "Bottled/filtered water. Tropical sun on Rio and Floripa beaches is fierce — sunscreen and hydration. Excellent private hospitals in big cities. Watch the surf: strong currents on Atlantic
