# ---------------------------------------------------------------
# Sama Sama - samasamaguides.com
#
# Same rules as _redirects, but in a file whose name does NOT start
# with an underscore - so it can never be hidden or left out of a
# drag-and-drop deploy. Netlify reads this first.
#
# Order matters: the /* catch-all MUST stay last.
# 302 = temporary (re-pointable). Never 301 here.
# ---------------------------------------------------------------

